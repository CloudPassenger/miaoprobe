# Example miaoprobe config file.
#
# Copy this to one of the auto-discovered locations, or point --config at it
# directly:
#   $XDG_CONFIG_HOME/miaoprobe/config.yaml (or ~/.config/miaoprobe/config.yaml)
#   /etc/miaoprobe/config.yaml             (conventional systemd path)
#
# The nesting here mirrors the flag names: a `log.level:` key under `log:`
# is the --log.level flag, and MP_LOG_LEVEL in the environment. `list`,
# `check`, and `serve` all read this same file; a command simply ignores
# keys for flags it doesn't have (so `check` skips the polling and metrics
# groups). Precedence, highest to lowest: command-line flag > MP_-prefixed
# environment variable > this file > flag default. See
# README.md#configuration.

# --- global (list + check + serve) ---

log:
  # trace, debug, info, warn, or error
  level: info
  # rich (colored console), text, or json
  format: rich

# --- shared by list, check, and serve ---

# a .js file, or a directory containing index.json. Optional if this
# binary was built with the embedded miaospeed-scripts nightly (see
# README.md#script-source) -- omit this key (or leave it empty) to use
# that instead.
scripts: /opt/miaospeed-scripts/dist

# script selection: id/category/region/tag are OR'd together, then `mode`
# decides whether matches are kept (include, the default) or dropped
# (exclude). All fields are optional; an empty filter matches everything.
# NOTE: unlike check/serve, `list` ignores this section entirely (and the
# MP_FILTER_* environment variables) unless --filter is also passed on its
# own command line -- it defaults to showing every script. See
# README.md#selecting-scripts---filter. Equivalent MP_FILTER_* environment
# variables (comma-separated): MP_FILTER_MODE, MP_FILTER_CATEGORY,
# MP_FILTER_REGION, MP_FILTER_TAG, MP_FILTER_ID.
filter:
  mode: include
  category: []
  region: []
  tag: []
  id: []

# --- list and check ---

output:
  # table or json
  format: table

# --- how a probe runs (check + serve) ---

probe:
  # egress proxy: http://host:port, https://host:port, or
  # socks5://host:port (empty = direct)
  proxy: socks5://127.0.0.1:1080

  # per-script execution timeout. A hard deadline: it cancels a script's
  # in-flight fetch() as well as interrupting its JavaScript.
  timeout: 30s

  startup:
    # Maximum time to wait for the configured egress path to become ready
    # before running scripts. Zero disables the startup connectivity gate.
    timeout: 0s
    # Checked through the same direct or proxy path used by script fetch().
    url: https://cp.cloudflare.com/generate_204

  # --- serve only ---

  # polling interval
  interval: 5m

  # how many scripts to probe in parallel; a cycle takes roughly
  # ceil(scripts / concurrency) slow probes instead of the sum of all of
  # them
  concurrency: 8

# --- serve only ---

metrics:
  # address /metrics is served on
  listen: ":9765"

  # also export Go runtime and process metrics (goroutines, heap, GC,
  # open fds, resident memory) for diagnosing miaoprobe itself
  runtime: true

otel:
  # unique service.instance.id used as Grafana's instance label; defaults to
  # the host name. Set this explicitly when host names are not unique/stable.
  instance: ""

  # OTLP endpoint to push metrics to (e.g. Grafana Cloud's OTLP gateway);
  # empty disables push, falls back to OTEL_EXPORTER_OTLP_* env vars
  endpoint: ""

  # OTLP wire protocol: http/protobuf or grpc
  protocol: http/protobuf

  # comma-separated key=value headers sent with every OTLP export
  headers: ""

  # disable TLS for the OTLP connection (local collectors only)
  insecure: false

  # how often buffered metrics are pushed to otel.endpoint
  interval: 1m
