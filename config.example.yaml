# Example miaoprobe config file.
#
# Copy this to one of the auto-discovered locations, or point --config at it
# directly:
#   $XDG_CONFIG_HOME/miaoprobe/config.yaml (or ~/.config/miaoprobe/config.yaml)
#   /etc/miaoprobe/config.yaml             (conventional systemd path)
#
# Keys match flag names verbatim (dashes included), except `filter` (see
# below), which is a nested section instead of a scalar. `list`, `check`,
# and `serve` all read this same file; a command simply ignores keys for
# flags it doesn't have. Precedence, highest to lowest: command-line flag >
# MP_-prefixed environment variable > this file > flag default. See
# README.md#configuration.

# --- global (check + serve) ---

# log level: trace, debug, info, warn, or error
log-level: info

# log format: rich (colored console), text, or json
log-format: rich

# --- shared by list, check, and serve ---

# a .js file, or a directory containing index.json. Optional if this
# binary was built with the embedded miaospeed-scripts nightly (see
# README.md#script-source) -- omit this key (or leave it empty) to use
# that instead.
scripts: /opt/miaospeed-scripts/dist

# script selection: id/category/region/tag are OR'd together, then `mode`
# decides whether matches are kept (include, the default) or dropped
# (exclude). All fields are optional; an empty filter matches everything.
# NOTE: unlike check/serve, `list` ignores this section entirely (and the
# MP_FILTER_* environment variables below) unless --filter is also passed
# on its own command line -- it defaults to showing every script. See
# README.md#selecting-scripts---filter. Equivalent MP_FILTER_* environment
# variables (comma-separated): MP_FILTER_MODE, MP_FILTER_CATEGORY,
# MP_FILTER_REGION, MP_FILTER_TAG, MP_FILTER_ID.
filter:
  mode: include
  category: []
  region: []
  tag: []
  id: []

# output format: table or json
format: table

# --- shared by check and serve ---

# egress proxy: http://host:port, https://host:port, or socks5://host:port
# (empty = direct)
proxy: socks5://127.0.0.1:1080

# per-script execution timeout
timeout: 30s

# --- serve only ---

# polling interval
interval: 5m

# how many scripts to probe in parallel; a cycle takes roughly
# ceil(scripts / concurrency) slow probes instead of the sum of all of them
concurrency: 8

# address /metrics is served on
listen: ":9765"

# OTLP endpoint to push metrics to (e.g. Grafana Cloud's OTLP gateway);
# empty disables push, falls back to OTEL_EXPORTER_OTLP_* env vars
otel-endpoint: ""

# OTLP wire protocol: http/protobuf or grpc
otel-protocol: http/protobuf

# comma-separated key=value headers sent with every OTLP export
otel-headers: ""

# disable TLS for the OTLP connection (local collectors only)
otel-insecure: false

# how often buffered metrics are pushed to otel-endpoint
otel-interval: 1m
