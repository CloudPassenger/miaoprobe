name: nightly

# On every push to main: build binaries + a multi-arch Docker image from
# HEAD, and publish them as a single rolling "nightly" pre-release/image
# for testing unreleased changes. This intentionally does not touch real
# version tags (see .goreleaser.yaml `nightly-*` snapshot version and
# `git.ignore_tags`) or the `latest` Docker tag, which are reserved for
# tagged releases (see release.yml).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

# Only one nightly build/publish at a time; a newer push supersedes any
# nightly run still in flight for an older commit.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Builds binaries + archives + checksums (dist/), using the
      # snapshot version template above. --skip=docker: we build/push the
      # nightly image ourselves below, straight from these binaries,
      # instead of goreleaser's own (tag-release-only) dockers_v2 pipe.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lay the linux binaries out the way Dockerfile expects
      # ($TARGETPLATFORM/miaoprobe, see dockers_v2's build context in
      # .goreleaser.yaml) so the same Dockerfile works here too.
      - run: |
          mkdir -p linux/amd64 linux/arm64
          cp dist/miaoprobe_linux_amd64_v1/miaoprobe linux/amd64/miaoprobe
          cp dist/miaoprobe_linux_arm64_v8.0/miaoprobe linux/arm64/miaoprobe

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cloudpassenger/miaoprobe:nightly

      # Move the rolling "nightly" release/tag to this commit.
      - run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automated build of ${{ github.sha }}, for testing unreleased changes. Not a stable release -- see the [latest release](https://github.com/CloudPassenger/miaoprobe/releases/latest) for that. Re-published on every push to main.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
