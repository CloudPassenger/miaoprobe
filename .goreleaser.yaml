version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: miaoprobe
    main: ./cmd/miaoprobe
    binary: miaoprobe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.version={{.Version}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.commit={{.Commit}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.date={{.Date}}

archives:
  - id: miaoprobe
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: CloudPassenger
    name: miaoprobe
