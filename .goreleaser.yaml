version: 2

before:
  hooks:
    - go mod tidy
    # Fetches the latest miaospeed-scripts nightly into
    # internal/script/embedded/ for the default miaoprobe build below (see
    # tools/fetchscripts); the miaoprobe-slim build ignores it.
    - go run ./tools/fetchscripts

builds:
  # miaoprobe (default) bakes in the miaospeed-scripts nightly build
  # fetched above (-tags embedscripts, see
  # internal/script/embedded_scripts.go), so it works out of the box
  # without --scripts.
  - id: miaoprobe
    main: ./cmd/miaoprobe
    binary: miaoprobe
    tags:
      - embedscripts
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.version={{.Version}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.commit={{.Commit}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.date={{.Date}}

  # miaoprobe-slim has no embedded scripts and requires --scripts (or the
  # config/env equivalent) at runtime.
  - id: miaoprobe-slim
    main: ./cmd/miaoprobe
    binary: miaoprobe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.version={{.Version}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.commit={{.Commit}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.date={{.Date}}

archives:
  - id: miaoprobe
    ids: [miaoprobe]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: miaoprobe-slim
    ids: [miaoprobe-slim]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_slim
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: CloudPassenger
    name: miaoprobe
