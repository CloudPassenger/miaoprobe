version: 2

before:
  hooks:
    - go mod tidy
    # Fetches the latest miaospeed-scripts nightly into
    # internal/script/embedded/ for the miaoprobe-embedded build below (see
    # tools/fetchscripts); the plain miaoprobe build ignores it.
    - go run ./tools/fetchscripts

builds:
  - id: miaoprobe
    main: ./cmd/miaoprobe
    binary: miaoprobe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.version={{.Version}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.commit={{.Commit}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.date={{.Date}}

  # miaoprobe-embedded bakes in the miaospeed-scripts nightly build fetched
  # above (-tags embedscripts, see internal/script/embedded_scripts.go), so
  # it works out of the box without --scripts.
  - id: miaoprobe-embedded
    main: ./cmd/miaoprobe
    binary: miaoprobe
    tags:
      - embedscripts
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.version={{.Version}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.commit={{.Commit}}
      - -X github.com/CloudPassenger/miaoprobe/internal/cli.date={{.Date}}

archives:
  - id: miaoprobe
    ids: [miaoprobe]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: miaoprobe-embedded
    ids: [miaoprobe-embedded]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_embedded
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: CloudPassenger
    name: miaoprobe
